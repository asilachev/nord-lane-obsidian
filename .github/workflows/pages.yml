name: Pages

# The landing page (site/) on GitHub Pages, in five languages: https://nordlane.silachev.com/ (#17).
# Its screenshots are the real app in each language. Obsidian doesn't run here, so they're taken
# locally with node scripts/site-shots.mjs and committed under site/screenshots/. Pull requests
# build the site to prove it; master deploys it.
on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'src/fonts/**'
      - 'theme.css'
      - 'manifest.json'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'src/fonts/**'
      - 'theme.css'
      - 'manifest.json'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build-site.mjs
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
